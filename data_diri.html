<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Diri - Evently</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <a href="user_dashboard.html" class="logo">
            <img src="assets/img/icon.png" alt="Evently"> Evently
        </a>
        <span class="menu-category">Menu</span>
        <a href="user_dashboard.html" class="menu-item"><img src="assets/img/icon-home.png" alt=""> Beranda</a>
        <a href="kegiatan.html" class="menu-item active"><img src="assets/img/icon-calendar.png" alt=""> Kegiatan</a>
        <a href="e-tiket.html" class="menu-item"><img src="assets/img/icon-ticket.png" alt=""> E-Tiket</a>
        <span class="menu-category">Akun</span>
        <a href="profil.html" class="menu-item"><img src="assets/img/icon-user.png" alt=""> Profil Saya</a>
        <a href="logout.html" class="menu-item"><img src="assets/img/icon-logout.png" alt=""> Keluar</a>
    </aside>

    <main class="content">

        <div class="stepper">
            <div class="step done">
                <div class="step-circle">✓</div>
                <span class="step-label">Pilih Event</span>
            </div>
            <div class="stepper-line done"></div>
            <div class="step active">
                <div class="step-circle">2</div>
                <span class="step-label">Data Diri</span>
            </div>
            <div class="stepper-line"></div>
            <div class="step">
                <div class="step-circle">3</div>
                <span class="step-label">Pembayaran</span>
            </div>
        </div>

        <div class="form-grid">

            <div class="card">
                <h3>Data Peserta</h3>
                <div class="field-row">
                    <div class="field-group">
                        <label class="field-label">Nama Lengkap</label>
                        <input type="text" class="field-input" value="Daniel Sesar">
                    </div>
                    <div class="field-group">
                        <label class="field-label">NPM</label>
                        <input type="text" class="field-input" value="260510022">
                    </div>
                </div>
                <div class="field-row">
                    <div class="field-group">
                        <label class="field-label">Jurusan</label>
                        <input type="text" class="field-input" value="Teknik Informatika">
                    </div>
                    <div class="field-group">
                        <label class="field-label">Semester</label>
                        <input type="text" class="field-input" value="6">
                    </div>
                </div>
                <div class="field-group">
                    <label class="field-label">Email Kampus</label>
                    <input type="email" class="field-input" value="260510022@unila.ac.id">
                </div>
                <div class="field-group">
                    <label class="field-label">No. Whatsapp</label>
                    <input type="tel" class="field-input" value="08134567890">
                </div>
            </div>

            <div class="card">
                <h3>Informasi Tambahan</h3>
                <div class="field-group">
                    <label class="field-label">Alasan mengikuti workshop</label>
                    <textarea class="field-textarea" placeholder="Tulis alasan kamu..."></textarea>
                </div>
                <span class="radio-label">Pengalaman desain sebelumnya</span>
                <div class="radio-group">
                    <input type="radio" name="pengalaman" id="ada">
                    <label for="ada">Ada</label>
                    <input type="radio" name="pengalaman" id="tidak" checked>
                    <label for="tidak">Tidak Ada</label>
                </div>
            </div>

            <div class="card">
                <h3>Ringkasan Pembayaran</h3>
                <div class="summary-banner">💻</div>
                <div class="summary-row">
                    <span class="summary-key">Tanggal</span>
                    <span class="summary-val">15 Mei 2026</span>
                </div>
                <div class="summary-row">
                    <span class="summary-key">Waktu</span>
                    <span class="summary-val">09.00 - 15.00</span>
                </div>
                <div class="summary-row">
                    <span class="summary-key">Lokasi</span>
                    <span class="summary-val">Aula Teknik Lt. 3, Gedung B</span>
                </div>
                <div class="summary-total">
                    <span class="key-total">Total</span>
                    <span class="val-total">Rp 150.000</span>
                </div>
            </div>

        </div>

        <button class="btn-submit" onclick="window.location='pembayaran.html'">
            Lanjut ke Pembayaran →
        </button>

    </main>
</div>

</body>
</html>
