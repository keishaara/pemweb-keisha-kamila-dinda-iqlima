<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kelola Kategori - Evently</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="admin_style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="logo"><img src="assets/img/icon.png" alt="Evently"> Evently</div>
            <div class="menu-category">Manajemen</div>
            <a href="admin_dashboard.html" class="menu-item"><img src="assets/img/icon-home2.png"> Dashboard</a>
            <a href="admin_verifikasi.html" class="menu-item"><img src="assets/img/icon-ticket.png"> Verifikasi Acara</a>
            <a href="admin_pengguna.html" class="menu-item"><img src="assets/img/icon-user-admin.png"> Pengguna</a>
            <a href="admin_kategori.html" class="menu-item active"><img src="assets/img/icon-kegiatan.png"> Kategori</a>
            <div class="menu-category">Sistem</div>
            <a href="logout.html" class="menu-item"><img src="assets/img/icon-logout.png"> Keluar</a>
        </aside>

        <main class="main-content">
            <div class="category-header">
                <h2>Kelola Kategori</h2>
                <button class="btn-tambah-kat">+ Tambah Kategori</button>
            </div>

            <div class="category-grid">

                <div class="cat-card">
                    <div class="cat-icon">
                        <img src="assets/img/icon-seminar.jpg" alt="Seminar">
                    </div>
                    <div class="cat-details">
                        <div class="cat-name">Seminar</div>
                        <div class="cat-count">48 acara</div>
                    </div>
                    <button class="btn-edit-kat">Edit</button>
                </div>

                <div class="cat-card">
                    <div class="cat-icon">
                        <img src="assets/img/icon-workshop.png" alt="Workshop">
                    </div>
                    <div class="cat-details">
                        <div class="cat-name">Workshop</div>
                        <div class="cat-count">62 acara</div>
                    </div>
                    <button class="btn-edit-kat">Edit</button>
                </div>

                <div class="cat-card">
                    <div class="cat-icon">
                        <img src="assets/img/icon-sport.jpg" alt="Olahraga">
                    </div>
                    <div class="cat-details">
                        <div class="cat-name">Olahraga</div>
                        <div class="cat-count">35 acara</div>
                    </div>
                    <button class="btn-edit-kat">Edit</button>
                </div>

                <div class="cat-card">
                    <div class="cat-icon">
                        <img src="assets/img/icon-seni.jpg" alt="Seni">
                    </div>
                    <div class="cat-details">
                        <div class="cat-name">Seni & Budaya</div>
                        <div class="cat-count">27 acara</div>
                    </div>
                    <button class="btn-edit-kat">Edit</button>
                </div>

                <div class="cat-card">
                    <div class="cat-icon">
                        <img src="assets/img/icon-akademik.jpg" alt="Akademik">
                    </div>
                    <div class="cat-details">
                        <div class="cat-name">Akademik</div>
                        <div class="cat-count">54 acara</div>
                    </div>
                    <button class="btn-edit-kat">Edit</button>
                </div>

            </div>
        </main>
    </div>
</body>
</html>
